<header class="site-header">
    <div class="container">
        <a href="{% url 'core:home' %}" class="logo">Учитель информатики</a>
        <nav>
            <a href="{% url 'core:about' %}">О учителе</a>
            <a href="{% url 'core:news_list' %}">Новости</a>
            <a href="{% url 'core:materials' %}">Материалы</a>
            <a href="{% url 'core:contacts' %}">Контакты</a>
            {% if user.is_authenticated %}
                {% if user.role == 'teacher' %}
                    <a href="{% url 'dashboard:teacher_dashboard' %}" class="btn">Кабинет</a>
                {% elif user.role == 'student' %}
                    <a href="{% url 'dashboard:student_dashboard' %}" class="btn">Кабинет</a>
                {% endif %}
                <a href="{% url 'accounts:logout' %}">Выход</a>
            {% else %}
                <a href="{% url 'accounts:login' %}">Вход</a>
            {% endif %}
        </nav>
    </div>
</header>
