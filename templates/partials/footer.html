<script>
// Установка даты последнего обновления
document.getElementById('lastUpdated').textContent = new Date().toLocaleDateString('ru-RU');

// Функции для социальных сетей
function shareOnVK() {
    const url = encodeURIComponent(window.location.href);
    window.open(`https://vk.com/share.php?url=${url}`, '_blank');
}

function shareOnTelegram() {
    const url = encodeURIComponent(window.location.href);
    const title = encodeURIComponent(document.title);
    window.open(`https://t.me/share/url?url=${url}&text=${title}`, '_blank');
}

function sendEmail() {
    window.location.href = 'mailto:teacher@school8.ru';
}

// Кнопка наверх
function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
